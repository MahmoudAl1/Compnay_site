<!DOCTYPE html>
<html lang="ar"  class="scroll-smooth">
  <head>
    <style>
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Sergany Company</title>
    <meta name="description" content="El Sergany Company - A leading provider of car and motorcycle batteries in Egypt. Authorized dealer for top global brands.">
    <meta property="og:title" content="El Sergany Company" />
    <meta property="og:description" content="شركة رائدة في عالم بطاريات السيارات والدراجات النارية في مصر. وكلاء كبرى الشركات العالمية." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://elserganycompany.com/images/logo.png" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
            },
            colors: {
              brand: {
                primary: '#2563EB', // Blue 600
                secondary: '#06B6D4', // Cyan 500
                dark: '#020617', // Slate 950
                accent: '#3B82F6' // Blue 500
              }
            },
            animation: {
              'scroll': 'scroll 30s linear infinite',
              'scroll-reverse': 'scroll-reverse 30s linear infinite',
              'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'shimmer': 'shimmer 2.5s infinite',
              'shine': 'shine 8s ease-in infinite',
            },
            keyframes: {
              scroll: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-25%)' },
              },
              'scroll-reverse': {
                '0%': { transform: 'translateX(-25%)' },
                '100%': { transform: 'translateX(0)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              shimmer: {
                '100%': { transform: 'translateX(100%)' }
              },
              shine: {
                '0%': { left: '-150%' },
                '30%': { left: '150%' },
                '100%': { left: '150%' }
              }
            }
          },
        },
      }
    </script>
<script type="importmap">

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
</head>

  </body>
</html>
